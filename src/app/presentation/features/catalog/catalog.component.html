<div class="catalog">

  <div class="catalog-header">
    <h2 class="page-title">Catálogo de productos</h2>
    @if (isAdmin()) {
      <p-button
        label="Agregar producto"
        icon="pi pi-plus"
        [outlined]="true"
        (onClick)="openDialog()" />
    }
  </div>

  @for (cat of categories(); track cat) {
    <div class="category-section">
      <h3 class="category-title">{{ cat }}</h3>
      <p-divider styleClass="divider-slim" />
      <div class="product-list">
        @for (product of productsByCategory()[cat]; track product.id) {
          <div class="product-row">
            <span class="product-name">{{ product.name }}</span>
            <div class="product-row-end">
              <span class="product-price">S/ {{ product.price | number:'1.2-2' }}</span>
              @if (isAdmin()) {
                <p-button
                  icon="pi pi-pencil"
                  [rounded]="true"
                  [text]="true"
                  severity="secondary"
                  size="small"
                  (onClick)="openEditDialog(product)" />
                <p-button
                  icon="pi pi-trash"
                  [rounded]="true"
                  [text]="true"
                  severity="danger"
                  size="small"
                  (onClick)="confirmDelete(product)" />
              }
            </div>
          </div>
        }
      </div>
    </div>
  }

</div>

<p-dialog
  [header]="dialogTitle()"
  [visible]="dialogVisible"
  (visibleChange)="dialogVisible = $event"
  [modal]="true"
  [style]="{ width: '420px' }"
  (onHide)="resetForm()">

  <div class="dialog-form">

    <div class="dialog-field">
      <label class="dialog-label">Nombre</label>
      <input type="text" pInputText [(ngModel)]="newName" placeholder="Ej: Lomo Saltado" />
    </div>

    <div class="dialog-field">
      <label class="dialog-label">Precio (S/)</label>
      <p-inputnumber
        [(ngModel)]="newPrice"
        mode="decimal"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        [min]="0.01"
        placeholder="0.00" />
    </div>

    <div class="dialog-field">
      <label class="dialog-label">Categoría</label>
      <p-select
        [(ngModel)]="newCategory"
        [options]="categoryOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body" />
    </div>

    <div class="dialog-actions">
      <p-button label="Cancelar" [text]="true" severity="secondary" (onClick)="closeDialog()" />
      <p-button label="Guardar" (onClick)="saveProduct()" [loading]="saving()" />
    </div>

  </div>

</p-dialog>
