<div class="shell">
  <header class="topbar">
    <div class="topbar-brand">
      <i class="pi pi-star-fill brand-icon"></i>
      <span class="brand-name">Restobar</span>
    </div>

    <div class="topbar-clock">
      <span class="clock-time">{{ formattedTime() }}</span>
      <span class="clock-date">{{ formattedDate() }}</span>
    </div>

    <div class="topbar-user">
      <div class="user-avatar">{{ currentUser()?.initials }}</div>
      <span class="user-name">{{ currentUser()?.name }}</span>
      <p-button
        icon="pi pi-sign-out"
        [text]="true"
        severity="secondary"
        (onClick)="confirmLogout()"
        pTooltip="Cerrar sesión"
        tooltipPosition="bottom" />
    </div>
  </header>

  <div class="shell-body">
    <!-- Sidebar: visible solo en desktop -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-item">
          <i class="pi pi-home"></i>
          <span>Inicio</span>
        </a>
        <a routerLink="/sales/new" routerLinkActive="nav-active" class="nav-item">
          <i class="pi pi-plus-circle"></i>
          <span>Nueva venta</span>
        </a>
        <a routerLink="/catalog" routerLinkActive="nav-active" class="nav-item">
          <i class="pi pi-list"></i>
          <span>Catálogo</span>
        </a>
        @if (currentUser()?.role === 'admin') {
          <a routerLink="/categories" routerLinkActive="nav-active" class="nav-item">
            <i class="pi pi-tags"></i>
            <span>Categorías</span>
          </a>
          <a routerLink="/cash-report" routerLinkActive="nav-active" class="nav-item">
            <i class="pi pi-chart-bar"></i>
            <span>Arqueo de caja</span>
          </a>
        }
      </nav>
    </aside>

    <main class="shell-content">
      <router-outlet />
    </main>
  </div>

  <!-- Bottom nav: visible solo en mobile -->
  <nav class="bottom-nav">
    <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-item">
      <i class="pi pi-home"></i>
      <span>Inicio</span>
    </a>
    <a routerLink="/sales/new" routerLinkActive="nav-active" class="nav-item">
      <i class="pi pi-plus-circle"></i>
      <span>Nueva venta</span>
    </a>
    <a routerLink="/catalog" routerLinkActive="nav-active" class="nav-item">
      <i class="pi pi-list"></i>
      <span>Catálogo</span>
    </a>
    @if (currentUser()?.role === 'admin') {
      <a routerLink="/categories" routerLinkActive="nav-active" class="nav-item">
        <i class="pi pi-tags"></i>
        <span>Categorías</span>
      </a>
      <a routerLink="/cash-report" routerLinkActive="nav-active" class="nav-item">
        <i class="pi pi-chart-bar"></i>
        <span>Arqueo</span>
      </a>
    }
  </nav>

  <p-toast position="top-center" />
  <p-confirmDialog />
</div>
